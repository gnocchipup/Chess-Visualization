<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Visualization for Noobs</title>
    <link rel="icon" type="image/png" href="./noobvisualize.png" />
  </head>
  <body>
    <div class="shell">
      <header id="app-header">
        <!-- Collapsible header. On mobile it collapses to a slim bar holding just
             the drag handle and the settings button (see HeaderCollapse in
             src/layout.js); pulling the handle down expands the title, account
             and help. On desktop both wrappers are display:contents, so the
             header lays out exactly as if this markup were not here. -->
        <div class="header-collapse" id="header-collapse">
          <div class="header-collapse-inner" id="header-collapse-inner">
            <h1 class="app-title">
              <img class="app-logo" src="./noobvisualize.png" alt="" />
              Chess Visualization for Noobs
            </h1>
            <div class="header-actions">
              <div class="dropdown-wrap">
                <button
                  id="account-btn"
                  class="account-btn"
                  type="button"
                  aria-expanded="false"
                  aria-controls="account-menu"
                  title="Account"
                >
                  <span id="account-avatar" class="avatar" aria-hidden="true">G</span>
                  <span id="account-name">Guest</span>
                  <span class="caret" aria-hidden="true">&middot;</span>
                </button>
                <div id="account-menu" class="menu account-menu" hidden>
                  <span id="auth-area" class="auth-area"></span>
                </div>
              </div>
              <a class="icon-btn help-link" href="./readme.html" title="How to use">?</a>
            </div>
          </div>
        </div>
        <div class="header-pinned">
          <button
            id="header-handle"
            class="header-handle"
            type="button"
            aria-expanded="false"
            aria-controls="header-collapse"
            title="Pull down for the full header"
          >
            <span class="header-handle-grip" aria-hidden="true"></span>
            <span class="sr-only">Show the full header</span>
          </button>
          <div class="dropdown-wrap">
            <button
              id="btn-settings"
              class="icon-btn"
              type="button"
              aria-expanded="false"
              aria-controls="settings-menu"
              title="Settings"
            >
              <span aria-hidden="true">&#9881;</span>
            </button>
            <div id="settings-menu" class="menu settings-menu" hidden>
              <p class="menu-kicker">Puzzle source</p>
              <label class="menu-row source-picker">
                <span>Source</span>
                <select id="source-select"></select>
              </label>
              <label class="menu-row set-picker">
                <span>Set</span>
                <select id="set-select"></select>
              </label>
              <label class="menu-row difficulty-picker" hidden>
                <span>Difficulty</span>
                <select id="difficulty-select"></select>
              </label>
              <hr class="menu-sep" />
              <p class="menu-kicker">Display</p>
              <label class="menu-row">
                <span>Ply back</span>
                <input id="ply-back" type="number" min="0" step="1" value="4" />
              </label>
              <hr class="menu-sep" />
              <button id="btn-builder" class="menu-cta" type="button">Puzzle sets&hellip;</button>
            </div>
          </div>
        </div>
      </header>

      <div id="score" class="score" title="Session score"></div>
      <div id="score-strip" class="score-strip" aria-label="Session results"></div>

      <main>
        <section id="board-wrap">
          <!-- Board frame: the 8x8 grid plus its chrome. The file letters and the
               rank numbers sit in gutters *outside* #board so the square-level
               drag/tap hit-testing in exercise.js is untouched, and the two small
               circles above and below the board name the colour at each end
               (painted by exercise.js paintSideDots). The gutters and the circles
               are aria-hidden: the board's own aria-label already states the
               orientation, so announcing them too would only double up. -->
          <div id="board-frame" class="board-frame">
            <div class="board-side board-side-top">
              <span id="board-dot-top" class="side-dot" aria-hidden="true"></span>
            </div>
            <div id="board-area" class="board-area">
              <div id="board" class="board" aria-label="Chess board"></div>
            </div>
            <div id="board-ranks" class="board-ranks" aria-hidden="true"></div>
            <div id="board-files" class="board-files" aria-hidden="true"></div>
            <div class="board-side board-side-bottom">
              <span id="board-dot-bottom" class="side-dot" aria-hidden="true"></span>
            </div>
          </div>
        </section>
        <section id="side">
          <div id="puzzle-info" class="puzzle-info">
            <p class="muted" id="empty-state">
              No puzzle loaded. Select or create a puzzle set, then press
              <strong>New puzzle</strong>.
            </p>
          </div>
          <div id="error-box" class="error" hidden></div>
          <div id="move-table-wrap">
            <table id="move-table" class="move-table"></table>
          </div>
          <div class="controls">
            <button id="btn-new" class="btn-primary" type="button">New puzzle</button>
            <!-- Board flip sits beside the primary action because the F shortcut
                 is out of reach on a phone: the state is persisted (cpt.flipped)
                 so the next puzzle starts the same way round, and the two colour
                 circles in the board frame turn their outlines red while it is on. -->
            <button
              id="btn-flip"
              type="button"
              aria-pressed="false"
              title="Flip the board 180&deg; (F) &mdash; remembered for the next puzzle"
            >
              <span class="flip-icon" aria-hidden="true">&#8645;</span>
              <span class="label-wide">Flip board</span>
              <span class="label-narrow">Flip</span>
            </button>
            <!-- Moved into the hint line by exercise.js renderInfo() and only
                 revealed once the solver asks for a hint. -->
            <button id="btn-reveal" type="button" hidden disabled>
              <span class="label-wide">Reveal solution</span>
              <span class="label-narrow">Reveal</span>
            </button>
          </div>
        </section>
      </main>
    </div>

    <!-- Kept for backwards compatibility: narrow-screen drawer hooks and the
         puzzle-set builder live outside the mock's card. -->
    <div id="header-body" class="header-body" hidden>
      <div id="topbar" class="topbar">
        <button id="drawer-toggle" class="drawer-toggle" type="button" aria-expanded="false">
          Settings
        </button>
      </div>
    </div>

    <section id="builder" hidden>
      <h2>Puzzle sets</h2>
      <div class="builder-grid">
        <fieldset>
          <legend>Create puzzle set</legend>
          <p class="muted">
            Select the plain, decompressed <code>lichess_db_puzzle.csv</code>.
            A <code>.csv.zst</code> must be decompressed first.
          </p>
          <label class="file-label">
            CSV file
            <input id="csv-file" type="file" accept=".csv" />
          </label>
          <label>
            Rating min
            <input id="rating-min" type="number" value="800" step="1" />
          </label>
          <label>
            Rating max
            <input id="rating-max" type="number" value="1600" step="1" />
          </label>
          <label>
            Number of puzzles
            <input id="puzzle-count" type="number" min="1" value="1000" step="1" />
          </label>
          <label>
            Set name
            <input id="set-name" type="text" placeholder="My puzzle set" />
          </label>
          <button id="btn-build" type="button">Build set</button>
          <div id="build-progress" class="progress" aria-live="polite"></div>
        </fieldset>
        <fieldset>
          <legend>Your sets</legend>
          <ul id="set-list" class="set-list"></ul>
          <label class="file-label">
            Import existing .sqlite
            <input id="import-file" type="file" accept=".sqlite,.db,.sqlite3" />
          </label>
          <div id="builder-msg" class="progress"></div>
        </fieldset>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
