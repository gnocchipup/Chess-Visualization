<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Visualization for Noobs</title>
    <link rel="icon" type="image/png" href="./noobvisualize.png" />
  </head>
  <body>
    <header id="app-header">
      <!-- Settings. On a narrow screen this panel hangs off the top of the
           viewport and is auto-hidden behind the top bar below (see
           src/layout.js); on a wide screen both wrappers are display: contents
           and this is simply the header row. -->
      <div id="header-body" class="header-body">
        <h1 class="app-title">
          <img class="app-logo" src="./noobvisualize.png" alt="" />
          Chess Visualization for Noobs
        </h1>
        <div class="header-controls">
          <label class="source-picker">
            Source
            <select id="source-select"></select>
          </label>
          <label class="set-picker">
            Set
            <select id="set-select"></select>
          </label>
          <label class="difficulty-picker" hidden>
            Difficulty
            <select id="difficulty-select"></select>
          </label>
          <span id="auth-area" class="auth-area" hidden></span>
          <label>
            Ply back
            <input id="ply-back" type="number" min="0" step="1" value="4" />
          </label>
          <button id="btn-builder" type="button">Puzzle sets</button>
          <span id="score" class="score" title="Session score"></span>
          <a class="help-link" href="./readme.html">How to use</a>
        </div>
      </div>

      <!-- The only part of the header left on screen once the settings panel
           is hidden, so the solving controls live here rather than inside it. -->
      <div id="topbar" class="topbar">
        <button
          id="drawer-toggle"
          class="drawer-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="header-body"
          title="Drag or tap to show settings"
        >
          <span class="drawer-grip" aria-hidden="true"></span>
          <span class="drawer-label">Settings</span>
          <span class="drawer-chevron" aria-hidden="true"></span>
        </button>
        <div class="topbar-actions">
          <button id="btn-new" type="button">New puzzle</button>
          <button id="btn-reveal" type="button" disabled>
            <span class="label-wide">Reveal solution</span>
            <span class="label-narrow">Reveal</span>
          </button>
        </div>
      </div>
    </header>

    <div id="score-strip" class="score-strip" aria-label="Session results"></div>

    <main>
      <section id="board-wrap">
        <div id="board" class="board" aria-label="Chess board"></div>
      </section>
      <section id="side">
        <div id="puzzle-info" class="puzzle-info">
          <p class="muted" id="empty-state">
            No puzzle loaded. Select or create a puzzle set, then press
            <strong>New puzzle</strong>.
          </p>
        </div>
        <div id="error-box" class="error" hidden></div>
        <div id="move-table-wrap">
          <table id="move-table" class="move-table"></table>
        </div>
      </section>
    </main>

    <section id="builder" hidden>
      <h2>Puzzle sets</h2>
      <div class="builder-grid">
        <fieldset>
          <legend>Create puzzle set</legend>
          <p class="muted">
            Select the plain, decompressed <code>lichess_db_puzzle.csv</code>.
            A <code>.csv.zst</code> must be decompressed first.
          </p>
          <label class="file-label">
            CSV file
            <input id="csv-file" type="file" accept=".csv" />
          </label>
          <label>
            Rating min
            <input id="rating-min" type="number" value="800" step="1" />
          </label>
          <label>
            Rating max
            <input id="rating-max" type="number" value="1600" step="1" />
          </label>
          <label>
            Number of puzzles
            <input id="puzzle-count" type="number" min="1" value="1000" step="1" />
          </label>
          <label>
            Set name
            <input id="set-name" type="text" placeholder="My puzzle set" />
          </label>
          <button id="btn-build" type="button">Build set</button>
          <div id="build-progress" class="progress" aria-live="polite"></div>
        </fieldset>
        <fieldset>
          <legend>Your sets</legend>
          <ul id="set-list" class="set-list"></ul>
          <label class="file-label">
            Import existing .sqlite
            <input id="import-file" type="file" accept=".sqlite,.db,.sqlite3" />
          </label>
          <div id="builder-msg" class="progress"></div>
        </fieldset>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
